name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: cmd
        run: build.bat

      - name: Test
        shell: cmd
        run: build\dsp_test.exe

      # Fails the build if an exe loses ASLR, DEP, high-entropy ASLR or control flow guard.
      - name: Check binary hardening
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $failed = $false
          foreach ($exe in 'SimpleAudioSplit.exe', 'sas-cli.exe') {
            $headers = & $dumpbin.FullName /headers "build\$exe" | Out-String
            foreach ($flag in 'Dynamic base', 'NX compatible', 'High Entropy Virtual Addresses', 'Control Flow Guard') {
              if ($headers -notmatch [regex]::Escape($flag)) { Write-Host "::error::$exe is missing: $flag"; $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SimpleAudioSplit
          path: |
            build/SimpleAudioSplit.exe
            build/sas-cli.exe

  # Pushing a tag like v1.2.0 publishes the binaries built above as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only commits that are on main (and so went through review and CI) can be released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SimpleAudioSplit

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum SimpleAudioSplit.exe sas-cli.exe | tee SHA256SUMS
          gh release create "$GITHUB_REF_NAME" SimpleAudioSplit.exe sas-cli.exe SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Simple Audio Split ${GITHUB_REF_NAME#v}" \
            --generate-notes
